name: AI-SIEM CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Compile Python modules
        run: python -m compileall -q backend agents tests

      - name: Run unit tests
        run: python -m unittest discover tests -v
        env:
          AI_SIEM_API_KEY: test-token
          AI_SIEM_RATE_LIMIT_PER_MINUTE: 1000
          AI_SIEM_INGEST_RATE_LIMIT_PER_MINUTE: 1000

      - name: Bandit security scan
        run: bandit -q -r backend agents -lll

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Docker Compose
        run: docker compose config
