name: AI-SIEM CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Compile Python modules
        run: python -m compileall -q backend agents tests

      - name: Run unit tests
        run: python -m unittest discover tests -v
        env:
          AI_SIEM_API_KEY: test-token
          AI_SIEM_RATE_LIMIT_PER_MINUTE: 1000
          AI_SIEM_INGEST_RATE_LIMIT_PER_MINUTE: 1000

      - name: Bandit security scan
        run: bandit -q -r backend agents -lll

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Docker Compose
        run: docker compose config
