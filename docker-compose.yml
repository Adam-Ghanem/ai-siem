services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AI_SIEM_HOST: 0.0.0.0
      AI_SIEM_PORT: 8000
      AI_SIEM_ALLOWED_ORIGIN: http://localhost:5173
      AI_SIEM_API_KEY: ${AI_SIEM_API_KEY:?Set AI_SIEM_API_KEY before starting}
      AI_SIEM_STORAGE: sqlite
      AI_SIEM_DB_PATH: /app/data/ai_siem.db
      AI_SIEM_RATE_LIMIT_PER_MINUTE: ${AI_SIEM_RATE_LIMIT_PER_MINUTE:-60}
      AI_SIEM_INGEST_RATE_LIMIT_PER_MINUTE: ${AI_SIEM_INGEST_RATE_LIMIT_PER_MINUTE:-10}
      AI_SIEM_TRUST_PROXY_HEADERS: "false"
    volumes:
      - ai_siem_data:/app/data
      - ai_siem_logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  ai_siem_data:
  ai_siem_logs:
